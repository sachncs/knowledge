name: Build and deploy product page

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Install dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Build documentation pages
        run: |
          cp CHANGELOG.md docs/changelog.md
          cp ROADMAP.md docs/roadmap.md
          cp CONTRIBUTING.md docs/contributing-full.md
          cp CODE_OF_CONDUCT.md docs/code-of-conduct.md
          cp SECURITY.md docs/security.md
          cp BENCHMARK.md docs/benchmark.md
          python -m mkdocs build --strict

      - name: Copy .nojekyll to dist
        working-directory: site
        run: |
          if [ ! -f dist/.nojekyll ]; then
            touch dist/.nojekyll
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
