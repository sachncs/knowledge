<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#11151E" />
    </linearGradient>
    <radialGradient id="aurora1" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="rgba(91,107,242,0.45)" />
      <stop offset="100%" stop-color="rgba(91,107,242,0)" />
    </radialGradient>
    <radialGradient id="aurora2" cx="90%" cy="100%" r="50%">
      <stop offset="0%" stop-color="rgba(94,234,212,0.30)" />
      <stop offset="100%" stop-color="rgba(94,234,212,0)" />
    </radialGradient>
    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9AA8FF" />
      <stop offset="100%" stop-color="#3D4FE0" />
    </linearGradient>
    <linearGradient id="nodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B5C0FF" />
      <stop offset="100%" stop-color="#5B6BF2" />
    </linearGradient>
    <linearGradient id="nodeC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D5DEFF" />
      <stop offset="100%" stop-color="#7C8BFF" />
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B5C0FF" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#aurora1)" />
  <rect width="1200" height="630" fill="url(#aurora2)" />

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
  </g>

  <!-- Knowledge graph nodes (decorative) -->
  <g transform="translate(880, 180)">
    <g stroke="#5B6BF2" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="0" x2="-100" y2="80" />
      <line x1="0" y1="0" x2="100" y2="80" />
      <line x1="0" y1="0" x2="0" y2="100" />
    </g>
    <circle cx="-100" cy="80" r="14" fill="url(#nodeC)" />
    <circle cx="0" cy="0" r="20" fill="url(#nodeA)" />
    <circle cx="0" cy="100" r="11" fill="url(#nodeB)" />
    <circle cx="100" cy="80" r="14" fill="url(#nodeC)" />
  </g>

  <!-- Logo mark + wordmark -->
  <g transform="translate(80, 180)">
    <rect width="80" height="80" rx="18" fill="#11151E" stroke="rgba(91,107,242,0.4)" stroke-width="1" />
    <g transform="translate(40, 40)">
      <g stroke="#5B6BF2" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="0" y1="-12" x2="-14" y2="10" />
        <line x1="0" y1="-12" x2="14" y2="10" />
        <line x1="0" y1="-12" x2="0" y2="16" />
      </g>
      <circle cx="-14" cy="10" r="4" fill="url(#nodeC)" />
      <circle cx="0" cy="-12" r="6" fill="url(#nodeA)" />
      <circle cx="0" cy="16" r="3.5" fill="url(#nodeB)" />
      <circle cx="14" cy="10" r="4" fill="url(#nodeC)" />
    </g>
    <text x="100" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="32" fill="#FFFFFF" letter-spacing="-1">knowledge</text>
    <text x="100" y="58" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="13" fill="#9AA8FF" letter-spacing="0">v0.1 · MIT</text>
  </g>

  <!-- Hero copy -->
  <text x="80" y="340" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="84" fill="url(#text)" letter-spacing="-3">
    <tspan x="80" dy="0">Documentation,</tspan>
    <tspan x="80" dy="92">structured.</tspan>
  </text>

  <text x="80" y="540" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" fill="#B5C0FF" opacity="0.85">
    <tspan x="80" dy="0">LLM-powered OKF bundle creation from any</tspan>
    <tspan x="80" dy="30">documentation source. MIT licensed.</tspan>
  </text>
</svg>