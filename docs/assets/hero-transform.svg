<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A documentation page on the left is decomposed by section heading into an OKF bundle of linked Markdown files on the right.">
  <title>Document to OKF bundle</title>
  <defs>
    <!-- Node gradients match the wordmark palette -->
    <linearGradient id="indigoA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6BF2"/>
      <stop offset="1" stop-color="#3D4FE0"/>
    </linearGradient>
    <linearGradient id="indigoB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA8FF"/>
      <stop offset="1" stop-color="#5B6BF2"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6FB"/>
    </linearGradient>
    <linearGradient id="sheetEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E6F4"/>
      <stop offset="1" stop-color="#D5DAEC"/>
    </linearGradient>
    <linearGradient id="dirBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1B2238"/>
    </linearGradient>
    <linearGradient id="connect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B6BF2"/>
      <stop offset="1" stop-color="#9AA8FF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Reusable concept file card -->
    <symbol id="conceptFile" viewBox="0 0 220 36">
      <rect x="0" y="0" width="220" height="36" rx="6" ry="6" fill="#FFFFFF" stroke="#E2E6F4"/>
      <rect x="0" y="0" width="4" height="36" fill="url(#indigoA)"/>
      <text x="14" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6B7280">id</text>
      <text x="40" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#111827">getting-started</text>
      <text x="14" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6B7280">title</text>
      <text x="40" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#111827">Getting Started</text>
    </symbol>
  </defs>

  <!-- LEFT: Source document -->
  <g filter="url(#softShadow)">
    <rect x="40" y="36" width="280" height="288" rx="12" fill="url(#sheetEdge)"/>
    <rect x="44" y="40" width="272" height="280" rx="10" fill="url(#sheet)"/>
    <!-- Document chrome -->
    <circle cx="58"  cy="58" r="3" fill="#E2E6F4"/>
    <circle cx="68"  cy="58" r="3" fill="#E2E6F4"/>
    <circle cx="78"  cy="58" r="3" fill="#E2E6F4"/>
    <text x="44" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#9CA3AF">docs/style-guide.html</text>

    <!-- Headings: each is a "concept" that gets extracted -->
    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
      <!-- H1 -->
      <rect x="60" y="104" width="120" height="14" rx="3" fill="#111827"/>
      <text x="60" y="142" font-size="11" fill="#6B7280"># Python Style Guide</text>

      <!-- H2 (the extraction unit) -->
      <rect x="60" y="160" width="80" height="10" rx="2" fill="url(#indigoA)"/>
      <text x="60" y="184" font-size="10" fill="#6B7280">## Naming Conventions</text>

      <!-- H2 -->
      <rect x="60" y="200" width="100" height="10" rx="2" fill="url(#indigoA)"/>
      <text x="60" y="224" font-size="10" fill="#6B7280">## Imports</text>

      <!-- H2 -->
      <rect x="60" y="240" width="70" height="10" rx="2" fill="url(#indigoA)"/>
      <text x="60" y="264" font-size="10" fill="#6B7280">## Comments</text>
    </g>
  </g>

  <!-- Flow connector lines from headings to bundle files -->
  <g stroke="url(#connect)" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.85">
    <path d="M 320 164 C 380 164, 380 110, 440 110"/>
    <path d="M 320 204 C 380 204, 380 170, 440 170"/>
    <path d="M 320 244 C 380 244, 380 230, 440 230"/>
  </g>

  <!-- RIGHT: OKF bundle directory -->
  <g filter="url(#softShadow)">
    <rect x="400" y="36" width="280" height="288" rx="12" fill="url(#dirBg)"/>
    <!-- Terminal-style header -->
    <rect x="400" y="36" width="280" height="28" rx="12" fill="#0B1220"/>
    <circle cx="416" cy="50" r="3" fill="#374151"/>
    <circle cx="426" cy="50" r="3" fill="#374151"/>
    <circle cx="436" cy="50" r="3" fill="#374151"/>
    <text x="660" y="54" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6B7280">pyguide/</text>

    <!-- Directory tree -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="416" y="86"  fill="#9AA8FF">pyguide/</text>
      <text x="432" y="106" fill="#E5E7EB">├── index.md</text>

      <!-- Concept file cards overlay the tree lines for visual richness -->
      <use href="#conceptFile" x="428" y="116" width="220" height="36"/>
      <text x="432" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#111827" opacity="0">naming-conventions.md</text>

      <use href="#conceptFile" x="428" y="176" width="220" height="36"/>
      <text x="432" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#111827" opacity="0">imports.md</text>

      <use href="#conceptFile" x="428" y="236" width="220" height="36"/>
      <text x="432" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#111827" opacity="0">comments.md</text>

      <text x="432" y="296" fill="#6B7280">└── …</text>
    </g>
  </g>

  <!-- Center label -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <rect x="312" y="158" width="56" height="28" rx="14" fill="#FFFFFF" stroke="#E2E6F4"/>
    <text x="340" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#3D4FE0">LLM</text>
  </g>
</svg>
