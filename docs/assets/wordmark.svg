<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="knowledge">
  <title>knowledge</title>
  <defs>
    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6BF2"/>
      <stop offset="1" stop-color="#3D4FE0"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C8BFF"/>
      <stop offset="1" stop-color="#5B6BF2"/>
    </linearGradient>
    <linearGradient id="nodeC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA8FF"/>
      <stop offset="1" stop-color="#7C8BFF"/>
    </linearGradient>
  </defs>
  <!-- Three connected nodes representing a knowledge graph: one central concept linked to two derived concepts -->
  <g stroke="#3D4FE0" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="60" y1="40" x2="32" y2="80"/>
    <line x1="60" y1="40" x2="92" y2="82"/>
    <line x1="60" y1="40" x2="60" y2="86"/>
  </g>
  <circle cx="32" cy="80" r="10" fill="url(#nodeC)"/>
  <circle cx="60" cy="40" r="14" fill="url(#nodeA)"/>
  <circle cx="60" cy="86" r="8"  fill="url(#nodeB)"/>
  <circle cx="92" cy="82" r="10" fill="url(#nodeC)"/>
  <!-- Wordmark: Inter, semibold, tight tracking. SVG so it scales cleanly. -->
  <text x="130" y="78"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-weight="600"
        font-size="64"
        letter-spacing="-2"
        fill="currentColor">knowledge</text>
</svg>
